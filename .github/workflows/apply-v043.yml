name: Apply v0.4.3 Runtime Settings Button

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply v0.4.3 patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python .github/patch-v043.py

      - name: Validate JavaScript
        run: node --check scripts/media-overlay.js

      - name: Validate feature
        run: |
          grep -q 'gmo-runtime-settings' scripts/media-overlay.js
          grep -q 'openManagerForOverlay' scripts/media-overlay.js
          grep -q 'gmo-settings-focus' styles/media-overlay.css
          node -e "const m=require('./module.json'); if(m.version!=='0.4.3') process.exit(1); if(!m.download.includes('/v0.4.3/')) process.exit(1);"

      - name: Commit v0.4.3
        run: |
          git config user.name "thegexgekko"
          git config user.email "thegexgekko@gmail.com"
          git add -A
          git commit -m "Add runtime settings button in v0.4.3"
          git push
