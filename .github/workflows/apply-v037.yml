name: Apply v0.3.7 Custom Frame Gap

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run v0.3.7 custom frame gap patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch source
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          # --- JavaScript ---
          js_path = Path('scripts/media-overlay.js')
          js = js_path.read_text(encoding='utf-8')

          if 'customFramePadding' not in js:
              raise SystemExit('customFramePadding not found in JavaScript')

          # Rename the setting everywhere, then keep backward compatibility with 0.3.6 saves.
          js = js.replace('customFramePadding', 'customFrameGap')
          old_norm = 'overlay.customFrameGap = clamp(safeNumber(overlay.customFrameGap, 8), 0, 40);'
          new_norm = 'overlay.customFrameGap = clamp(safeNumber(overlay.customFrameGap, safeNumber(data.customFramePadding, 8)), 0, 40);'
          if old_norm not in js:
              raise SystemExit('custom frame gap normalization marker not found')
          js = js.replace(old_norm, new_norm, 1)

          old_apply = 'frame.style.padding = `${safeFrameValue(overlay.customFrameGap, 8, 0, 40)}px`;'
          new_apply = '''frame.style.setProperty("--gmo-custom-frame-gap", `${safeFrameValue(overlay.customFrameGap, 8, 0, 40)}px`);
              frame.style.padding = "0";'''
          if old_apply not in js:
              raise SystemExit('custom frame padding application marker not found')
          js = js.replace(old_apply, new_apply, 1)
          js_path.write_text(js, encoding='utf-8')

          # --- Manager template ---
          tpl_path = Path('templates/manager.hbs')
          tpl = tpl_path.read_text(encoding='utf-8')
          if 'customFramePadding' not in tpl:
              raise SystemExit('customFramePadding not found in template')
          tpl = tpl.replace('customFramePadding', 'customFrameGap')
          tpl = tpl.replace('Marge interne du cadre personnalisé', 'Écart entre le cadre et le média')
          tpl = tpl.replace("Crée un espace entre le média et le cadre sans modifier l'opacité du fond.", "Repousse le cadre vers l’extérieur sans réduire le média ni modifier l’opacité du fond.")
          tpl_path.write_text(tpl, encoding='utf-8')

          # --- CSS ---
          css_path = Path('styles/media-overlay.css')
          css = css_path.read_text(encoding='utf-8')
          old_inset = 'inset: calc(var(--gmo-custom-frame-width, 18px) * -1);'
          new_inset = 'inset: calc(-1 * (var(--gmo-custom-frame-width, 18px) + var(--gmo-custom-frame-gap, 8px)));'
          if old_inset not in css:
              raise SystemExit('custom frame inset marker not found')
          css = css.replace(old_inset, new_inset, 1)
          css_path.write_text(css, encoding='utf-8')

          # --- README ---
          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('Version actuelle : **0.3.6**.', 'Version actuelle : **0.3.7**.')
          readme = readme.replace('sa marge interne', 'son écart avec le média')
          readme = readme.replace("l’épaisseur du cadre et sa marge interne", "l’épaisseur du cadre et l’écart entre le cadre et le média")
          readme_path.write_text(readme, encoding='utf-8')

          # --- Manifest ---
          module_path = Path('module.json')
          module = json.loads(module_path.read_text(encoding='utf-8'))
          module['version'] = '0.3.7'
          module['download'] = 'https://github.com/thegexgekko/gekko-media-overlay/releases/download/v0.3.7/gekko-media-overlay-0.3.7.zip'
          module_path.write_text(json.dumps(module, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check scripts/media-overlay.js

      - name: Verify frame gap behavior
        shell: bash
        run: |
          grep -q 'customFrameGap' scripts/media-overlay.js
          grep -q 'Écart entre le cadre et le média' templates/manager.hbs
          grep -q -- '--gmo-custom-frame-gap' styles/media-overlay.css
          ! grep -q 'frame.style.padding = `${safeFrameValue(overlay.customFrameGap' scripts/media-overlay.js

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-v037.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "thegexgekko"
          git config user.email "thegexgekko@gmail.com"
          git add scripts/media-overlay.js templates/manager.hbs styles/media-overlay.css README.md module.json .github/workflows/apply-v037.yml
          git commit -m "Make custom frame gap expand outward in v0.3.7"
          git push
