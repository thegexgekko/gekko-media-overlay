name: Apply v0.4.0 Token Attached Overlays

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Retry v0.4.0 token attached overlays patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python tools/apply_v040.py

      - name: Validate JavaScript
        run: node --check scripts/media-overlay.js

      - name: Verify token feature
        shell: bash
        run: |
          grep -q 'Attachée à un token' scripts/media-overlay.js
          grep -q 'renderTokenHUD' scripts/media-overlay.js
          grep -q 'positionTokenAttachedFrame' scripts/media-overlay.js
          grep -q 'Token lié' templates/manager.hbs
          grep -q '"version": "0.4.0"' module.json

      - name: Commit v0.4.0
        shell: bash
        run: |
          git config user.name "thegexgekko"
          git config user.email "thegexgekko@gmail.com"
          git add -A
          git commit -m "Add token-attached media overlays in v0.4.0"
          git push
