name: Apply v0.4.0 Token Attached Overlays

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run v0.4.0 token attached overlays patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch source
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Marker not found: {label}')
              return text.replace(old, new, 1)

          js_path = Path('scripts/media-overlay.js')
          js = js_path.read_text(encoding='utf-8')

          js = replace_once(js,
          'const PLACEMENT_MODES = new Set(["fixed", "gm", "player"]);',
          'const PLACEMENT_MODES = new Set(["fixed", "gm", "player", "token"]);\nconst TOKEN_ANCHORS = new Set(["top", "bottom", "left", "right", "top-left", "top-right", "bottom-left", "bottom-right"]);',
          'placement modes')

          js = replace_once(js,
          '''  floatWidth: 60,\n  floatHeight: 35,\n  preserveRatio: true,''',
          '''  floatWidth: 60,\n  floatHeight: 35,\n  tokenSceneId: "",\n  tokenId: "",\n  tokenName: "",\n  tokenAnchor: "top-right",\n  tokenDistance: 20,\n  preserveRatio: true,''',
          'token defaults')

          js = replace_once(js,
          '''  overlay.floatWidth = clamp(safeNumber(overlay.floatWidth, overlay.widthUnit === "vw" ? overlay.width : 60), 8, 96);\n  overlay.floatHeight = clamp(safeNumber(overlay.floatHeight, 35), 8, 92);\n  overlay.contentOpacity = clamp(safeNumber(overlay.contentOpacity, 100), 10, 100);''',
          '''  overlay.floatWidth = clamp(safeNumber(overlay.floatWidth, overlay.widthUnit === "vw" ? overlay.width : 60), 8, 96);\n  overlay.floatHeight = clamp(safeNumber(overlay.floatHeight, 35), 8, 92);\n  overlay.tokenSceneId = typeof overlay.tokenSceneId === "string" ? overlay.tokenSceneId : "";\n  overlay.tokenId = typeof overlay.tokenId === "string" ? overlay.tokenId : "";\n  overlay.tokenName = typeof overlay.tokenName === "string" ? overlay.tokenName : "";\n  overlay.tokenAnchor = TOKEN_ANCHORS.has(overlay.tokenAnchor) ? overlay.tokenAnchor : "top-right";\n  overlay.tokenDistance = clamp(safeNumber(overlay.tokenDistance, 20), 0, 200);\n  overlay.contentOpacity = clamp(safeNumber(overlay.contentOpacity, 100), 10, 100);''',
          'normalize token fields')

          marker = 'function setFloatingFramePosition(frame, x, y, { clampToViewport = true } = {}) {'
          token_helpers = r'''function tokenPlaceableFor(overlay) {
  if (!canvas?.scene || !overlay.tokenId) return null;
  if (overlay.tokenSceneId && canvas.scene.id !== overlay.tokenSceneId) return null;
  return canvas.tokens?.get(overlay.tokenId) ?? null;
}

function tokenScreenBounds(token) {
  if (!token) return null;
  const bounds = token.getBounds?.();
  if (!bounds) return null;

  const view = canvas?.app?.canvas ?? canvas?.app?.view;
  const viewRect = view?.getBoundingClientRect?.() ?? { left: 0, top: 0, width: window.innerWidth, height: window.innerHeight };
  const screenWidth = canvas?.app?.screen?.width || viewRect.width || window.innerWidth || 1;
  const screenHeight = canvas?.app?.screen?.height || viewRect.height || window.innerHeight || 1;
  const scaleX = (viewRect.width || screenWidth) / screenWidth;
  const scaleY = (viewRect.height || screenHeight) / screenHeight;

  return {
    left: viewRect.left + bounds.x * scaleX,
    top: viewRect.top + bounds.y * scaleY,
    width: bounds.width * scaleX,
    height: bounds.height * scaleY
  };
}

function positionTokenAttachedFrame(frame, overlay) {
  const token = tokenPlaceableFor(overlay);
  if (!token) {
    frame.style.display = "none";
    return null;
  }

  const tokenBounds = tokenScreenBounds(token);
  if (!tokenBounds) {
    frame.style.display = "none";
    return null;
  }

  frame.style.display = "flex";
  const rect = frame.getBoundingClientRect();
  const halfW = rect.width / 2;
  const halfH = rect.height / 2;
  const distance = clamp(safeNumber(overlay.tokenDistance, 20), 0, 200);
  const left = tokenBounds.left;
  const right = tokenBounds.left + tokenBounds.width;
  const top = tokenBounds.top;
  const bottom = tokenBounds.top + tokenBounds.height;
  const centerX = left + tokenBounds.width / 2;
  const centerY = top + tokenBounds.height / 2;

  let x = centerX;
  let y = top - distance - halfH;
  switch (overlay.tokenAnchor) {
    case "bottom": y = bottom + distance + halfH; break;
    case "left": x = left - distance - halfW; y = centerY; break;
    case "right": x = right + distance + halfW; y = centerY; break;
    case "top-left": x = left - distance - halfW; y = top - distance - halfH; break;
    case "top-right": x = right + distance + halfW; y = top - distance - halfH; break;
    case "bottom-left": x = left - distance - halfW; y = bottom + distance + halfH; break;
    case "bottom-right": x = right + distance + halfW; y = bottom + distance + halfH; break;
  }

  frame.style.left = `${x}px`;
  frame.style.top = `${y}px`;
  frame.style.right = "auto";
  frame.style.bottom = "auto";
  frame.style.transform = "translate(-50%, -50%)";
  return { x, y };
}

let tokenFollowAnimationFrame = null;
function ensureTokenFollowLoop() {
  if (tokenFollowAnimationFrame !== null) return;
  const tick = () => {
    tokenFollowAnimationFrame = null;
    const frames = [...document.querySelectorAll('.gmo-runtime[data-placement-mode="token"] .gmo-token-attached-frame')];
    for (const frame of frames) {
      const root = frame.closest(".gmo-runtime");
      const overlay = root?._gmoOverlay;
      if (overlay) positionTokenAttachedFrame(frame, overlay);
    }
    if (frames.length) tokenFollowAnimationFrame = requestAnimationFrame(tick);
  };
  tokenFollowAnimationFrame = requestAnimationFrame(tick);
}

'''
          js = replace_once(js, marker, token_helpers + marker, 'token helpers')

          js = replace_once(js,
          '''  const result = setFloatingFrameSize(frame, overlay, w, h);\n  requestAnimationFrame(() => setFloatingFramePosition(frame, Number(frame.dataset.floatX) || 50, Number(frame.dataset.floatY) || 50));\n  return result;''',
          '''  const result = setFloatingFrameSize(frame, overlay, w, h);\n  requestAnimationFrame(() => {\n    if (overlay.placementMode === "token") positionTokenAttachedFrame(frame, overlay);\n    else setFloatingFramePosition(frame, Number(frame.dataset.floatX) || 50, Number(frame.dataset.floatY) || 50);\n  });\n  return result;''',
          'runtime size token reposition')

          js = replace_once(js,
          '''function canResizeOverlay(overlay, { preview = false } = {}) {\n  return canDragOverlay(overlay, { preview });\n}\n\nfunction canPlayerClose(overlay, { preview = false, controllerOnly = false } = {}) {\n  return !preview && !controllerOnly && !game.user?.isGM && overlay.allowPlayerClose;\n}''',
          '''function canResizeOverlay(overlay, { preview = false } = {}) {\n  if (preview) return false;\n  if (overlay.placementMode === "token") return Boolean(game.user?.isGM);\n  return canDragOverlay(overlay, { preview });\n}\n\nfunction canPlayerClose(overlay, { preview = false, controllerOnly = false } = {}) {\n  if (overlay.placementMode === "token") return false;\n  return !preview && !controllerOnly && !game.user?.isGM && overlay.allowPlayerClose;\n}''',
          'token control permissions')

          js = replace_once(js,
          '    badge.textContent = "PLACEMENT MJ";',
          '    badge.textContent = overlay.placementMode === "token" ? "LIÉ AU TOKEN" : "PLACEMENT MJ";',
          'controller badge')

          js = replace_once(js,
          '''      const size = setFloatingFrameSize(frame, overlay, w, h);\n\n      const resizedRect = frame.getBoundingClientRect();''',
          '''      const size = setFloatingFrameSize(frame, overlay, w, h);\n\n      if (overlay.placementMode === "token") {\n        positionTokenAttachedFrame(frame, overlay);\n        latest = { ...latest, ...size };\n        if (game.user.isGM && !rafPending) {\n          rafPending = true;\n          requestAnimationFrame(() => {\n            rafPending = false;\n            broadcastPacket({ action: "geometry", overlayId: overlay.id, w: latest.w, h: latest.h });\n          });\n        }\n        return;\n      }\n\n      const resizedRect = frame.getBoundingClientRect();''',
          'token resize movement')

          js = replace_once(js,
          '''      if (overlay.placementMode === "gm" && game.user.isGM) {\n        broadcastPacket({ action: "geometry", overlayId: overlay.id, ...latest });\n        await persistGMGeometry(overlay.id, latest);\n      } else if (overlay.placementMode === "player") {''',
          '''      if (overlay.placementMode === "token" && game.user.isGM) {\n        broadcastPacket({ action: "geometry", overlayId: overlay.id, w: latest.w, h: latest.h });\n        await persistGMGeometry(overlay.id, { w: latest.w, h: latest.h });\n        positionTokenAttachedFrame(frame, overlay);\n      } else if (overlay.placementMode === "gm" && game.user.isGM) {\n        broadcastPacket({ action: "geometry", overlayId: overlay.id, ...latest });\n        await persistGMGeometry(overlay.id, latest);\n      } else if (overlay.placementMode === "player") {''',
          'token resize persistence')

          js = replace_once(js,
          '''  if (overlay.placementMode === "fixed") {\n    frame.classList.add(`gmo-pos-${positionClass(overlay.position)}`);\n    frame.style.width = cssDimension(overlay.width, overlay.widthUnit, "width");\n    frame.style.height = cssDimension(overlay.height, overlay.heightUnit, "height");\n  } else {\n    frame.classList.add("gmo-floating-frame");''',
          '''  if (overlay.placementMode === "fixed") {\n    frame.classList.add(`gmo-pos-${positionClass(overlay.position)}`);\n    frame.style.width = cssDimension(overlay.width, overlay.widthUnit, "width");\n    frame.style.height = cssDimension(overlay.height, overlay.heightUnit, "height");\n  } else if (overlay.placementMode === "token") {\n    frame.classList.add("gmo-floating-frame", "gmo-token-attached-frame");\n    const size = overlay.resetFloatingSize\n      ? { w: initialFloatingWidthFor(overlay), h: overlay.floatHeight }\n      : floatingSizeFor(overlay);\n    setFloatingFrameSize(frame, overlay, size.w, size.h);\n    frame.dataset.tokenId = overlay.tokenId;\n    frame.dataset.tokenSceneId = overlay.tokenSceneId;\n    requestAnimationFrame(() => {\n      if (!frame.isConnected) return;\n      positionTokenAttachedFrame(frame, overlay);\n      ensureTokenFollowLoop();\n    });\n  } else {\n    frame.classList.add("gmo-floating-frame");''',
          'render token mode')

          js = replace_once(js,
          '''      setFloatingFrameSize(frame, overlay, Number(frame.dataset.floatWidth) || overlay.floatWidth, null);\n      setFloatingFramePosition(frame, Number(frame.dataset.floatX) || 50, Number(frame.dataset.floatY) || 50);''',
          '''      setFloatingFrameSize(frame, overlay, Number(frame.dataset.floatWidth) || overlay.floatWidth, null);\n      if (overlay.placementMode === "token") positionTokenAttachedFrame(frame, overlay);\n      else setFloatingFramePosition(frame, Number(frame.dataset.floatX) || 50, Number(frame.dataset.floatY) || 50);''',
          'media load token position')

          js = js.replace(
          'const isGMController = overlay.placementMode === "gm" && game.user.isGM;',
          'const isGMController = ["gm", "token"].includes(overlay.placementMode) && game.user.isGM;')

          js = replace_once(js,
          '''    ["fixed", "Position fixe"],\n    ["gm", "Flottante — contrôlée par le MJ"],\n    ["player", "Flottante — contrôlée par le joueur"]''',
          '''    ["fixed", "Position fixe"],\n    ["gm", "Flottante — contrôlée par le MJ"],\n    ["player", "Flottante — contrôlée par le joueur"],\n    ["token", "Attachée à un token"]''',
          'placement option token')

          insert_after = '''function placementModeOptions(current) {\n  return [\n    ["fixed", "Position fixe"],\n    ["gm", "Flottante — contrôlée par le MJ"],\n    ["player", "Flottante — contrôlée par le joueur"],\n    ["token", "Attachée à un token"]\n  ].map(([value, label]) => ({ value, label, selected: current === value }));\n}\n'''
          token_options_helpers = r'''

function tokenAnchorOptions(current) {
  return [
    ["top", "Haut"],
    ["bottom", "Bas"],
    ["left", "Gauche"],
    ["right", "Droite"],
    ["top-left", "Haut gauche"],
    ["top-right", "Haut droite"],
    ["bottom-left", "Bas gauche"],
    ["bottom-right", "Bas droite"]
  ].map(([value, label]) => ({ value, label, selected: current === value }));
}

function tokenOptionsForOverlay(overlay) {
  const currentSceneId = canvas?.scene?.id ?? "";
  const options = [];
  for (const token of canvas?.scene?.tokens ?? []) {
    options.push({
      value: token.id,
      label: token.name || token.id,
      selected: currentSceneId === overlay.tokenSceneId && token.id === overlay.tokenId
    });
  }
  options.sort((a, b) => a.label.localeCompare(b.label, game.i18n.lang));
  if (overlay.tokenId && !options.some(option => option.selected)) {
    options.unshift({
      value: overlay.tokenId,
      label: `${overlay.tokenName || "Token lié"} — autre scène`,
      selected: true
    });
  }
  return options;
}
'''
          js = replace_once(js, insert_after, insert_after + token_options_helpers, 'token option helpers')

          js = replace_once(js,
          '''        isGMFloatingMode: overlay.placementMode === "gm",\n        isPlayerFloatingMode: overlay.placementMode === "player",\n        isFloatingMode: overlay.placementMode !== "fixed",''',
          '''        isGMFloatingMode: overlay.placementMode === "gm",\n        isPlayerFloatingMode: overlay.placementMode === "player",\n        isTokenMode: overlay.placementMode === "token",\n        isFloatingMode: overlay.placementMode !== "fixed",''',
          'context token mode')

          js = replace_once(js,
          '''        placementModes: placementModeOptions(overlay.placementMode),\n        contentTypes: contentTypeOptions(overlay.contentType),''',
          '''        placementModes: placementModeOptions(overlay.placementMode),\n        tokenAnchors: tokenAnchorOptions(overlay.tokenAnchor),\n        tokenOptions: tokenOptionsForOverlay(overlay),\n        contentTypes: contentTypeOptions(overlay.contentType),''',
          'context token options')

          js = replace_once(js,
          '''      placementMode: get('[name="placementMode"]')?.value || "fixed",\n      floatX: Number(get('[name="floatX"]')?.value || 50),''',
          '''      placementMode: get('[name="placementMode"]')?.value || "fixed",\n      tokenSceneId: get('[name="tokenSceneId"]')?.value || "",\n      tokenId: get('[name="tokenId"]')?.value || "",\n      tokenName: get('[name="tokenName"]')?.value || "",\n      tokenAnchor: get('[name="tokenAnchor"]')?.value || "top-right",\n      tokenDistance: Number(get('[name="tokenDistance"]')?.value || 20),\n      floatX: Number(get('[name="floatX"]')?.value || 50),''',
          'read token fields')

          js = replace_once(js,
          '''    if (event.target.matches('input[name="contentOpacity"], input[name="backgroundOpacity"], input[name="customFrameThickness"], input[name="customFrameGap"]')) {\n      const output = event.target.closest(".gmo-range-row")?.querySelector("output");\n      if (output) output.textContent = ["customFrameThickness", "customFrameGap"].includes(event.target.name)''',
          '''    if (event.target.matches('input[name="contentOpacity"], input[name="backgroundOpacity"], input[name="customFrameThickness"], input[name="customFrameGap"], input[name="tokenDistance"]')) {\n      const output = event.target.closest(".gmo-range-row")?.querySelector("output");\n      if (output) output.textContent = ["customFrameThickness", "customFrameGap", "tokenDistance"].includes(event.target.name)''',
          'token distance live output')

          js = replace_once(js,
          '''    if (event.target.matches('select[name="placementMode"]')) {\n      this.#applyPlacementClasses(card, event.target.value);\n      if (event.target.value !== "fixed") this.#setFloatingInputsFromAnchor(card);\n      return;\n    }\n\n    if (event.target.matches('select[name="position"]')) {\n      const mode = card.querySelector('select[name="placementMode"]')?.value ?? "fixed";\n      if (mode !== "fixed") this.#setFloatingInputsFromAnchor(card);\n      return;\n    }''',
          '''    if (event.target.matches('select[name="placementMode"]')) {\n      this.#applyPlacementClasses(card, event.target.value);\n      if (["gm", "player"].includes(event.target.value)) this.#setFloatingInputsFromAnchor(card);\n      return;\n    }\n\n    if (event.target.matches('select[name="tokenId"]')) {\n      const option = event.target.selectedOptions?.[0];\n      const sceneInput = card.querySelector('[name="tokenSceneId"]');\n      const nameInput = card.querySelector('[name="tokenName"]');\n      if (sceneInput) sceneInput.value = canvas?.scene?.id ?? "";\n      if (nameInput) nameInput.value = option?.textContent?.replace(/ — autre scène$/, "") ?? "";\n      return;\n    }\n\n    if (event.target.matches('select[name="position"]')) {\n      const mode = card.querySelector('select[name="placementMode"]')?.value ?? "fixed";\n      if (["gm", "player"].includes(mode)) this.#setFloatingInputsFromAnchor(card);\n      return;\n    }''',
          'placement change token')

          js = replace_once(js,
          '''    card.classList.toggle("gmo-placement-gm", mode === "gm");\n    card.classList.toggle("gmo-placement-player", mode === "player");\n    card.classList.toggle("gmo-placement-floating", mode !== "fixed");''',
          '''    card.classList.toggle("gmo-placement-gm", mode === "gm");\n    card.classList.toggle("gmo-placement-player", mode === "player");\n    card.classList.toggle("gmo-placement-token", mode === "token");\n    card.classList.toggle("gmo-placement-floating", mode !== "fixed");''',
          'placement token class')

          js = replace_once(js,
          '''    if (!this.#hasContent(overlay)) {\n      ui.notifications.warn("Ajoute d’abord un contenu à cette fenêtre.");\n      return;\n    }\n    const targets = resolveTargets(overlay);''',
          '''    if (!this.#hasContent(overlay)) {\n      ui.notifications.warn("Ajoute d’abord un contenu à cette fenêtre.");\n      return;\n    }\n    if (overlay.placementMode === "token" && !overlay.tokenId) {\n      ui.notifications.warn("Choisis d’abord le token auquel attacher cette fenêtre.");\n      return;\n    }\n    const targets = resolveTargets(overlay);''',
          'show token validation')

          js = replace_once(js,
          '''    if (overlay.placementMode === "gm") {\n      broadcastPacket({ action: "geometry", overlayId: overlay.id, x, y, w, h });\n      ui.notifications.info("Position et taille MJ réinitialisées.");''',
          '''    if (overlay.placementMode === "token") {\n      broadcastPacket({ action: "geometry", overlayId: overlay.id, w, h });\n      ui.notifications.info("Taille de la fenêtre liée au token réinitialisée.");\n    } else if (overlay.placementMode === "gm") {\n      broadcastPacket({ action: "geometry", overlayId: overlay.id, x, y, w, h });\n      ui.notifications.info("Position et taille MJ réinitialisées.");''',
          'reset token geometry')

          js = replace_once(js,
          '''function openManager() {\n  if (!game.user.isGM) return;\n  if (managerInstance?.rendered) {\n    managerInstance.bringToFront();\n    return;\n  }\n  managerInstance = new MediaOverlayManager();\n  managerInstance.render({ force: true });\n}\n''',
          '''function openManager() {\n  if (!game.user.isGM) return;\n  if (managerInstance?.rendered) {\n    managerInstance.bringToFront();\n    return;\n  }\n  managerInstance = new MediaOverlayManager();\n  managerInstance.render({ force: true });\n}\n\nasync function createAttachedOverlayForToken(token) {\n  if (!game.user?.isGM) return;\n  const document = token?.document ?? token;\n  const tokenId = document?.id;\n  const sceneId = document?.parent?.id ?? canvas?.scene?.id ?? "";\n  if (!tokenId || !sceneId) {\n    ui.notifications.warn("Impossible d’identifier ce token.");\n    return;\n  }\n\n  const overlays = getStoredOverlays();\n  const overlay = createOverlayData();\n  overlay.name = `${document.name || "Token"} — média lié`;\n  overlay.placementMode = "token";\n  overlay.tokenSceneId = sceneId;\n  overlay.tokenId = tokenId;\n  overlay.tokenName = document.name || "Token";\n  overlay.tokenAnchor = "top-right";\n  overlay.tokenDistance = 20;\n  overlay.width = 20;\n  overlay.widthUnit = "vw";\n  overlay.floatWidth = 20;\n  overlay.includeGM = true;\n  overlay.allowPlayerClose = false;\n  overlays[overlay.id] = overlay;\n  await setStoredOverlays(overlays);\n  ui.notifications.info(`Fenêtre liée créée pour « ${overlay.tokenName} ». Ajoute maintenant son contenu.`);\n  openManager();\n  if (managerInstance?.rendered) await managerInstance.render({ force: true });\n}\n''',
          'create attached token helper')

          js = replace_once(js,
          '''Hooks.once("init", () => {''',
          '''Hooks.on("renderTokenHUD", (hud, html) => {\n  if (!game.user?.isGM) return;\n  const root = html instanceof HTMLElement ? html : html?.[0] ?? hud?.element?.[0] ?? hud?.element;\n  if (!(root instanceof HTMLElement)) return;\n  const token = hud?.object ?? canvas?.tokens?.get(hud?.object?.document?.id ?? hud?.document?.id);\n  if (!token) return;\n  const column = root.querySelector(".col.right") ?? root.querySelector(".right");\n  if (!column || column.querySelector(".gmo-token-hud-control")) return;\n\n  const button = document.createElement("div");\n  button.className = "control-icon gmo-token-hud-control";\n  button.title = "GEKKO — Attacher une fenêtre média à ce token";\n  button.setAttribute("role", "button");\n  button.setAttribute("tabindex", "0");\n  button.innerHTML = '<i class="gmo-gekko-icon"></i>';\n  const activate = async event => {\n    event.preventDefault();\n    event.stopPropagation();\n    await createAttachedOverlayForToken(token);\n  };\n  button.addEventListener("click", activate);\n  button.addEventListener("keydown", event => {\n    if (["Enter", " "].includes(event.key)) activate(event);\n  });\n  column.appendChild(button);\n});\n\nHooks.once("init", () => {''',
          'token hud hook')

          js = replace_once(js,
          '''    document.querySelectorAll(".gmo-floating-frame").forEach(frame => {\n      setFloatingFramePosition(frame, Number(frame.dataset.floatX) || 50, Number(frame.dataset.floatY) || 50);\n    });''',
          '''    document.querySelectorAll(".gmo-floating-frame").forEach(frame => {\n      const root = frame.closest(".gmo-runtime");\n      const overlay = root?._gmoOverlay;\n      if (overlay?.placementMode === "token") positionTokenAttachedFrame(frame, overlay);\n      else setFloatingFramePosition(frame, Number(frame.dataset.floatX) || 50, Number(frame.dataset.floatY) || 50);\n    });''',
          'resize token behavior')

          js = replace_once(js,
          '''      loadCustomFrames\n    };''',
          '''      loadCustomFrames,\n      createAttachedOverlayForToken\n    };''',
          'module api token')

          js_path.write_text(js, encoding='utf-8')

          tpl_path = Path('templates/manager.hbs')
          tpl = tpl_path.read_text(encoding='utf-8')
          tpl = replace_once(tpl,
          '''{{#if isPlayerFloatingMode}}gmo-placement-player{{/if}} {{#if isMediaContent}}''',
          '''{{#if isPlayerFloatingMode}}gmo-placement-player{{/if}} {{#if isTokenMode}}gmo-placement-token{{/if}} {{#if isMediaContent}}''',
          'template token class')

          tpl = replace_once(tpl,
          '''            <small class="gmo-placement-hint gmo-hint-player">Chaque joueur déplace et redimensionne sa copie indépendamment.</small>\n          </div>\n\n          <div class="gmo-field">\n            <label>Position initiale</label>''',
          '''            <small class="gmo-placement-hint gmo-hint-player">Chaque joueur déplace et redimensionne sa copie indépendamment.</small>\n            <small class="gmo-placement-hint gmo-hint-token">La fenêtre suit le token et reste contrôlable uniquement par le MJ.</small>\n          </div>\n\n          <div class="gmo-field gmo-token-options">\n            <label>Token lié</label>\n            <select name="tokenId">\n              <option value="">— Choisir un token —</option>\n              {{#each tokenOptions}}\n                <option value="{{value}}" {{#if selected}}selected{{/if}}>{{label}}</option>\n              {{/each}}\n            </select>\n            <input name="tokenSceneId" type="hidden" value="{{tokenSceneId}}">\n            <input name="tokenName" type="hidden" value="{{tokenName}}">\n          </div>\n\n          <div class="gmo-field gmo-token-options">\n            <label>Position autour du token</label>\n            <select name="tokenAnchor">\n              {{#each tokenAnchors}}\n                <option value="{{value}}" {{#if selected}}selected{{/if}}>{{label}}</option>\n              {{/each}}\n            </select>\n            <label class="gmo-token-distance-label">Distance du token</label>\n            <div class="gmo-range-row">\n              <input name="tokenDistance" type="range" min="0" max="200" step="1" value="{{tokenDistance}}">\n              <output>{{tokenDistance}} px</output>\n            </div>\n          </div>\n\n          <div class="gmo-field gmo-screen-position-options">\n            <label>Position initiale</label>''',
          'template token fields')

          tpl = replace_once(tpl,
          '''<label><input name="allowPlayerClose" type="checkbox" {{#if allowPlayerClose}}checked{{/if}}> Joueur peut fermer</label>''',
          '''<label class="gmo-player-close-option"><input name="allowPlayerClose" type="checkbox" {{#if allowPlayerClose}}checked{{/if}}> Joueur peut fermer</label>''',
          'hide player close token')
          tpl_path.write_text(tpl, encoding='utf-8')

          css_path = Path('styles/media-overlay.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('/* GEKKO — Media Overlay v0.3.5 */', '/* GEKKO — Media Overlay v0.4.0 */', 1)
          css = replace_once(css,
          '''.gmo-placement-fixed .gmo-hint-fixed,\n.gmo-placement-gm .gmo-hint-gm,\n.gmo-placement-player .gmo-hint-player {\n  display: block;\n}''',
          '''.gmo-placement-fixed .gmo-hint-fixed,\n.gmo-placement-gm .gmo-hint-gm,\n.gmo-placement-player .gmo-hint-player,\n.gmo-placement-token .gmo-hint-token {\n  display: block;\n}''',
          'css token hint')
          css += r'''

/* Fenêtres média attachées à un token. */
.gmo-token-options {
  display: none;
}

.gmo-placement-token .gmo-token-options {
  display: block;
}

.gmo-placement-token .gmo-screen-position-options,
.gmo-placement-token .gmo-floating-status,
.gmo-placement-token .gmo-player-close-option {
  display: none;
}

.gmo-token-distance-label {
  display: block;
  margin-top: 8px;
  margin-bottom: 4px;
  font-weight: 600;
}

.gmo-token-attached-frame {
  touch-action: none;
}

.gmo-token-hud-control {
  cursor: pointer;
}

.gmo-token-hud-control .gmo-gekko-icon {
  display: inline-grid;
  place-items: center;
  width: 100%;
  height: 100%;
}
'''
          css_path.write_text(css, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          if '- Trois modes de placement : fixe, flottant contrôlé par le MJ, flottant contrôlé par chaque joueur.' in readme:
              readme = readme.replace(
                  '- Trois modes de placement : fixe, flottant contrôlé par le MJ, flottant contrôlé par chaque joueur.',
                  '- Quatre modes de placement : fixe, flottant contrôlé par le MJ, flottant contrôlé par chaque joueur, ou attaché à un token.', 1)
          marker = '- Déplacement direct à la souris.'
          if marker in readme and 'HUD du token' not in readme:
              readme = readme.replace(marker, marker + '\n- Bouton GEKKO dans le HUD des tokens pour créer rapidement une fenêtre liée.\n- Fenêtres liées : 8 positions autour du token, distance réglable et suivi automatique pendant les déplacements et le zoom.', 1)
          readme = readme.replace('Version actuelle : **0.3.7**.', 'Version actuelle : **0.4.0**.', 1)
          readme_path.write_text(readme, encoding='utf-8')

          module_path = Path('module.json')
          module = json.loads(module_path.read_text(encoding='utf-8'))
          module['version'] = '0.4.0'
          module['download'] = 'https://github.com/thegexgekko/gekko-media-overlay/releases/download/v0.4.0/gekko-media-overlay-0.4.0.zip'
          module_path.write_text(json.dumps(module, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check scripts/media-overlay.js

      - name: Verify token feature markers
        shell: bash
        run: |
          grep -q 'Attachée à un token' scripts/media-overlay.js
          grep -q 'renderTokenHUD' scripts/media-overlay.js
          grep -q 'positionTokenAttachedFrame' scripts/media-overlay.js
          grep -q 'Écart entre le cadre et le média' templates/manager.hbs
          grep -q 'Token lié' templates/manager.hbs
          grep -q '"version": "0.4.0"' module.json

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-v040.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "thegexgekko"
          git config user.email "thegexgekko@gmail.com"
          git add scripts/media-overlay.js templates/manager.hbs styles/media-overlay.css README.md module.json .github/workflows/apply-v040.yml
          git commit -m "Add token-attached media overlays in v0.4.0"
          git push
