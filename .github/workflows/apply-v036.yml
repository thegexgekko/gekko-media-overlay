name: Apply v0.3.6 Custom Frame Padding

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run v0.3.6 custom frame padding patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch source
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Marker not found: {label}')
              return text.replace(old, new, 1)

          js_path = Path('scripts/media-overlay.js')
          js = js_path.read_text(encoding='utf-8')

          js = replace_once(js,
          '''  customFrame: null,\n  customFrameThickness: 18,\n  allowPlayerClose: false,''',
          '''  customFrame: null,\n  customFrameThickness: 18,\n  customFramePadding: 8,\n  allowPlayerClose: false,''',
          'default custom frame padding')

          js = replace_once(js,
          '''  overlay.customFrame = overlay.customFrame && typeof overlay.customFrame === "object" ? clone(overlay.customFrame) : null;\n  overlay.customFrameThickness = clamp(safeNumber(overlay.customFrameThickness, 18), 4, 64);\n  overlay.allowPlayerClose = Boolean(overlay.allowPlayerClose);''',
          '''  overlay.customFrame = overlay.customFrame && typeof overlay.customFrame === "object" ? clone(overlay.customFrame) : null;\n  overlay.customFrameThickness = clamp(safeNumber(overlay.customFrameThickness, 18), 4, 64);\n  overlay.customFramePadding = clamp(safeNumber(overlay.customFramePadding, 8), 0, 40);\n  overlay.allowPlayerClose = Boolean(overlay.allowPlayerClose);''',
          'normalize custom frame padding')

          js = replace_once(js,
          '''    frame.style.setProperty("--gmo-custom-frame-width", `${safeFrameValue(overlay.customFrameThickness, 18, 4, 64)}px`);\n    frame.style.border = "0";\n    frame.style.padding = "0";\n    frame.style.borderRadius = "0";''',
          '''    frame.style.setProperty("--gmo-custom-frame-width", `${safeFrameValue(overlay.customFrameThickness, 18, 4, 64)}px`);\n    frame.style.border = "0";\n    frame.style.padding = `${safeFrameValue(overlay.customFramePadding, 8, 0, 40)}px`;\n    frame.style.borderRadius = "0";''',
          'apply custom frame padding')

          js = replace_once(js,
          '''      customFrame,\n      customFrameThickness: Number(get('[name="customFrameThickness"]')?.value || 18),\n      allowPlayerClose: Boolean(get('[name="allowPlayerClose"]')?.checked),''',
          '''      customFrame,\n      customFrameThickness: Number(get('[name="customFrameThickness"]')?.value || 18),\n      customFramePadding: Number(get('[name="customFramePadding"]')?.value || 8),\n      allowPlayerClose: Boolean(get('[name="allowPlayerClose"]')?.checked),''',
          'read custom frame padding')

          js = replace_once(js,
          '''    if (event.target.matches('input[name="contentOpacity"], input[name="backgroundOpacity"], input[name="customFrameThickness"]')) {\n      const output = event.target.closest(".gmo-range-row")?.querySelector("output");\n      if (output) {\n        output.textContent = event.target.name === "customFrameThickness"\n          ? `${event.target.value} px`\n          : `${event.target.value} %`;\n      }\n    }''',
          '''    if (event.target.matches('input[name="contentOpacity"], input[name="backgroundOpacity"], input[name="customFrameThickness"], input[name="customFramePadding"]')) {\n      const output = event.target.closest(".gmo-range-row")?.querySelector("output");\n      if (output) {\n        output.textContent = ["customFrameThickness", "customFramePadding"].includes(event.target.name)\n          ? `${event.target.value} px`\n          : `${event.target.value} %`;\n      }\n    }''',
          'range output custom frame padding')

          js_path.write_text(js, encoding='utf-8')

          tpl_path = Path('templates/manager.hbs')
          tpl = tpl_path.read_text(encoding='utf-8')
          tpl = replace_once(tpl,
          '''          <div class="gmo-field gmo-custom-frame-options">\n            <label>Épaisseur du cadre personnalisé</label>\n            <div class="gmo-range-row">\n              <input name="customFrameThickness" type="range" min="6" max="48" step="1" value="{{customFrameThickness}}">\n              <output>{{customFrameThickness}} px</output>\n            </div>\n            <small class="gmo-field-help">Ajuste l'épaisseur du 9-slice automatique autour du média.</small>\n          </div>''',
          '''          <div class="gmo-field gmo-custom-frame-options">\n            <label>Épaisseur du cadre personnalisé</label>\n            <div class="gmo-range-row">\n              <input name="customFrameThickness" type="range" min="6" max="48" step="1" value="{{customFrameThickness}}">\n              <output>{{customFrameThickness}} px</output>\n            </div>\n            <small class="gmo-field-help">Ajuste l'épaisseur du 9-slice automatique autour du média.</small>\n          </div>\n\n          <div class="gmo-field gmo-custom-frame-options">\n            <label>Marge interne du cadre personnalisé</label>\n            <div class="gmo-range-row">\n              <input name="customFramePadding" type="range" min="0" max="40" step="1" value="{{customFramePadding}}">\n              <output>{{customFramePadding}} px</output>\n            </div>\n            <small class="gmo-field-help">Crée un espace entre le média et le cadre sans modifier l'opacité du fond.</small>\n          </div>''',
          'template custom frame padding')
          tpl_path.write_text(tpl, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          if 'Version actuelle : **0.3.5**.' in readme:
              readme = readme.replace('Version actuelle : **0.3.5**.', 'Version actuelle : **0.3.6**.', 1)
          marker = 'Le nom affiché est dérivé automatiquement du nom du fichier.'
          if marker in readme and 'marge interne' not in readme.lower():
              readme = readme.replace(marker, marker + ' Le gestionnaire permet aussi de régler séparément l’épaisseur du cadre et sa marge interne, tandis que l’opacité du fond de fenêtre reste entièrement indépendante.', 1)
          readme_path.write_text(readme, encoding='utf-8')

          module_path = Path('module.json')
          module = json.loads(module_path.read_text(encoding='utf-8'))
          module['version'] = '0.3.6'
          module['download'] = 'https://github.com/thegexgekko/gekko-media-overlay/releases/download/v0.3.6/gekko-media-overlay-0.3.6.zip'
          module_path.write_text(json.dumps(module, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check scripts/media-overlay.js

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-v036.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "thegexgekko"
          git config user.email "thegexgekko@gmail.com"
          git add scripts/media-overlay.js templates/manager.hbs README.md module.json .github/workflows/apply-v036.yml
          git commit -m "Add custom frame inner margin in v0.3.6"
          git push
