name: Apply v0.3.2 Final Patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run final v0.3.2 frame patch v4'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.3.2 changes
        shell: bash
        run: |
          patch -p1 < .github/v032.patch

          if ! grep -q 'gmo-frame-custom-overlay::after' styles/media-overlay.css; then
            cat >> styles/media-overlay.css <<'CSS'

/* Cadres personnalisés simples : image complète superposée à la fenêtre. */
.gmo-frame-custom-overlay::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 4;
  background-image: var(--gmo-custom-frame-image);
  background-position: center;
  background-size: 100% 100%;
  background-repeat: no-repeat;
  pointer-events: none;
}
CSS
          fi

          node --check scripts/media-overlay.js
          python -m json.tool module.json >/dev/null

          rm -f .github/v032.patch
          rm -f .github/workflows/apply-v032.yml
          rm -f .github/workflows/apply-v032-patch.yml
          rm -f .github/workflows/apply-v032-final.yml

          git config user.name "thegexgekko"
          git config user.email "thegexgekko@gmail.com"
          git add -A
          git commit -m "Fix custom frame rendering and labels in v0.3.2"
          git push
