name: Apply v0.3.2 Final Patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run final v0.3.2 frame patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.3.2 changes
        shell: bash
        run: |
          patch -p1 --exclude='styles/media-overlay.css' < .github/v032.patch

          python <<'PY'
          from pathlib import Path
          p = Path('styles/media-overlay.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* Contrôles runtime : restent toujours opaques, même si le contenu ne l\'est pas. */'
          addition = '''/* Les cadres simples sont rendus comme une surcouche complète. Cela conserve
             leur dessin au lieu de les découper arbitrairement en 9-slice. */
          .gmo-frame-custom-overlay::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 4;
            background-image: var(--gmo-custom-frame-image);
            background-position: center;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            pointer-events: none;
          }

          '''
          if '.gmo-frame-custom-overlay::after' not in s:
              if marker not in s:
                  raise SystemExit('CSS insertion marker not found')
              s = s.replace(marker, addition + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

          node --check scripts/media-overlay.js
          python -m json.tool module.json >/dev/null

          rm -f .github/v032.patch
          rm -f .github/workflows/apply-v032.yml
          rm -f .github/workflows/apply-v032-patch.yml
          rm -f .github/workflows/apply-v032-final.yml

          git config user.name "thegexgekko"
          git config user.email "thegexgekko@gmail.com"
          git add -A
          git commit -m "Fix custom frame rendering and labels in v0.3.2"
          git push
