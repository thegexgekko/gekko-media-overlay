name: Apply v0.4.2 Collapsible Media Panels

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run v0.4.2 collapsible media panels'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply collapsible panels
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Marker not found: {label}')
              return text.replace(old, new, 1)

          js_path = Path('scripts/media-overlay.js')
          js = js_path.read_text(encoding='utf-8')

          js = replace_once(js,
            'let managerInstance = null;\nlet customFramesCache = new Map();',
            'let managerInstance = null;\nlet customFramesCache = new Map();\nlet collapsedOverlayIds = new Set();',
            'collapsed state')

          js = replace_once(js,
            '        isCustomFrame: overlay.frameStyle.startsWith("custom:"),\n        statusLabel:',
            '        isCustomFrame: overlay.frameStyle.startsWith("custom:"),\n        isCollapsed: collapsedOverlayIds.has(overlay.id),\n        statusLabel:',
            'context collapsed flag')

          js = replace_once(js,
            '      case "new": await this.#createOverlay(); break;\n      case "browse":',
            '      case "new": await this.#createOverlay(); break;\n      case "toggleCollapse": if (card) this.#toggleCollapse(card, button); break;\n      case "browse":',
            'toggle click')

          js = replace_once(js,
            '  #onInput(event) {',
            '''  #toggleCollapse(card, button = null) {
    const id = card?.dataset?.overlayId;
    if (!id) return;
    const collapsed = !card.classList.contains("gmo-collapsed");
    card.classList.toggle("gmo-collapsed", collapsed);
    if (collapsed) collapsedOverlayIds.add(id);
    else collapsedOverlayIds.delete(id);

    const toggle = button ?? card.querySelector('[data-action="toggleCollapse"]');
    if (toggle) {
      toggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
      toggle.title = collapsed ? "Déployer cette fenêtre" : "Réduire cette fenêtre";
      const icon = toggle.querySelector("i");
      if (icon) icon.className = `fa-solid ${collapsed ? "fa-chevron-right" : "fa-chevron-down"}`;
    }
  }

  #onInput(event) {''',
            'toggle method')

          js = replace_once(js,
            '    const overlay = createOverlayData();\n    overlays[overlay.id] = overlay;',
            '    const overlay = createOverlayData();\n    collapsedOverlayIds.delete(overlay.id);\n    overlays[overlay.id] = overlay;',
            'new overlay expanded')

          js = replace_once(js,
            '    clearPlayerPosition(id);\n    clearPlayerSize(id);',
            '    clearPlayerPosition(id);\n    clearPlayerSize(id);\n    collapsedOverlayIds.delete(id);',
            'delete collapsed state')

          js = replace_once(js,
            '  const overlay = createOverlayData();\n  overlay.name = `${tokenDocument.name || "Token"} — média lié`;',
            '  const overlay = createOverlayData();\n  collapsedOverlayIds.delete(overlay.id);\n  overlay.name = `${tokenDocument.name || "Token"} — média lié`;',
            'attached overlay expanded')

          js_path.write_text(js, encoding='utf-8')

          tpl_path = Path('templates/manager.hbs')
          tpl = tpl_path.read_text(encoding='utf-8')
          tpl = replace_once(tpl,
            '{{#if isCustomFrame}}gmo-frame-custom-selected{{/if}}" data-overlay-id="{{id}}">',
            '{{#if isCustomFrame}}gmo-frame-custom-selected{{/if}} {{#if isCollapsed}}gmo-collapsed{{/if}}" data-overlay-id="{{id}}">',
            'collapsed class')
          tpl = replace_once(tpl,
            '''        <div class="gmo-card-header">
          <input class="gmo-name" name="name" type="text" value="{{name}}" aria-label="Nom de la fenêtre">''',
            '''        <div class="gmo-card-header">
          <button type="button" class="gmo-collapse-toggle" data-action="toggleCollapse"
                  title="{{#if isCollapsed}}Déployer cette fenêtre{{else}}Réduire cette fenêtre{{/if}}"
                  aria-label="{{#if isCollapsed}}Déployer cette fenêtre{{else}}Réduire cette fenêtre{{/if}}"
                  aria-expanded="{{#if isCollapsed}}false{{else}}true{{/if}}">
            <i class="fa-solid {{#if isCollapsed}}fa-chevron-right{{else}}fa-chevron-down{{/if}}"></i>
          </button>
          <input class="gmo-name" name="name" type="text" value="{{name}}" aria-label="Nom de la fenêtre">''',
            'collapse button')
          tpl_path.write_text(tpl, encoding='utf-8')

          css_path = Path('styles/media-overlay.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('/* GEKKO — Media Overlay v0.4.1 */', '/* GEKKO — Media Overlay v0.4.2 */', 1)
          marker = '''.gmo-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
'''
          addition = marker + '''
.gmo-collapse-toggle {
  flex: 0 0 30px;
  width: 30px;
  min-width: 30px;
  height: 30px;
  min-height: 30px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: inherit;
  opacity: 0.78;
  cursor: pointer;
  transition: background 120ms ease, border-color 120ms ease, opacity 120ms ease;
}

.gmo-collapse-toggle:hover,
.gmo-collapse-toggle:focus-visible {
  opacity: 1;
  background: rgba(255, 255, 255, 0.07);
  border-color: rgba(255, 255, 255, 0.16);
}

.gmo-card-header .gmo-name {
  flex: 1 1 auto;
  width: auto;
  min-width: 0;
}

.gmo-overlay-card.gmo-collapsed {
  padding-top: 9px;
  padding-bottom: 9px;
}

.gmo-overlay-card.gmo-collapsed .gmo-card-header {
  margin-bottom: 0;
}

.gmo-overlay-card.gmo-collapsed > .gmo-grid,
.gmo-overlay-card.gmo-collapsed > .gmo-card-actions {
  display: none;
}

.gmo-overlay-card.gmo-collapsed .gmo-name {
  background: transparent;
  border-color: transparent;
  box-shadow: none;
  font-weight: 700;
}

.gmo-overlay-card.gmo-collapsed .gmo-name:hover,
.gmo-overlay-card.gmo-collapsed .gmo-name:focus {
  background: var(--color-cool-5-75, rgba(255,255,255,0.05));
  border-color: var(--color-border-light-2, #7776);
}
'''
          if marker not in css:
              raise SystemExit('CSS card header marker not found')
          css = css.replace(marker, addition, 1)
          css_path.write_text(css, encoding='utf-8')

          module_path = Path('module.json')
          module = json.loads(module_path.read_text(encoding='utf-8'))
          module['version'] = '0.4.2'
          module['download'] = 'https://github.com/thegexgekko/gekko-media-overlay/releases/download/v0.4.2/gekko-media-overlay-0.4.2.zip'
          module_path.write_text(json.dumps(module, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          feature = '- Les panneaux de réglage de chaque fenêtre peuvent être repliés pour faciliter la gestion de nombreuses fenêtres média.\n'
          anchor = '- Plusieurs fenêtres simultanées.\n'
          if feature not in readme:
              if anchor not in readme:
                  raise SystemExit('README feature anchor not found')
              readme = readme.replace(anchor, anchor + feature, 1)
          readme = readme.replace('Version actuelle : **0.4.1**.', 'Version actuelle : **0.4.2**.')
          readme_path.write_text(readme, encoding='utf-8')

          Path('.github/workflows/apply-v042.yml').unlink(missing_ok=True)
          PY

      - name: Validate JavaScript
        run: node --check scripts/media-overlay.js

      - name: Validate collapsible UI
        shell: bash
        run: |
          grep -q 'toggleCollapse' scripts/media-overlay.js
          grep -q 'gmo-collapse-toggle' templates/manager.hbs
          grep -q 'gmo-collapsed' styles/media-overlay.css
          node -e "const m=require('./module.json'); if(m.version!=='0.4.2') process.exit(1); if(!m.download.includes('/v0.4.2/')) process.exit(1);"

      - name: Commit v0.4.2
        shell: bash
        run: |
          git config user.name "thegexgekko"
          git config user.email "thegexgekko@gmail.com"
          git add -A
          git commit -m "Add collapsible media panels in v0.4.2"
          git push
