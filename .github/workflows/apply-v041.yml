name: Apply v0.4.1 Token Bounds Fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run v0.4.1 token bounds fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fix
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          js_path = Path('scripts/media-overlay.js')
          js = js_path.read_text(encoding='utf-8')
          start_marker = 'function tokenScreenBounds(token) {'
          end_marker = '\nfunction positionTokenAttachedFrame'
          start = js.find(start_marker)
          end = js.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('tokenScreenBounds markers not found')
          new_block = "function tokenScreenBounds(token) {\n  if (!token) return null;\n  const bounds = token.getBounds?.();\n  if (!bounds) return null;\n\n  // PIXI getBounds() renvoie déjà les coordonnées globales après pan/zoom.\n  // Ne pas réappliquer canvas.stage.worldTransform : cela comptait le pan/zoom deux fois.\n  const view = canvas?.app?.canvas ?? canvas?.app?.view;\n  const viewRect = view?.getBoundingClientRect?.() ?? { left: 0, top: 0, width: window.innerWidth, height: window.innerHeight };\n  const screenWidth = canvas?.app?.screen?.width || canvas?.app?.renderer?.screen?.width || viewRect.width || window.innerWidth || 1;\n  const screenHeight = canvas?.app?.screen?.height || canvas?.app?.renderer?.screen?.height || viewRect.height || window.innerHeight || 1;\n  const scaleX = (viewRect.width || screenWidth) / screenWidth;\n  const scaleY = (viewRect.height || screenHeight) / screenHeight;\n\n  return {\n    left: viewRect.left + bounds.x * scaleX,\n    top: viewRect.top + bounds.y * scaleY,\n    width: bounds.width * scaleX,\n    height: bounds.height * scaleY\n  };\n}\n"
          js = js[:start] + new_block + js[end:]
          js_path.write_text(js, encoding='utf-8')

          module_path = Path('module.json')
          module = json.loads(module_path.read_text(encoding='utf-8'))
          module['version'] = '0.4.1'
          module['download'] = 'https://github.com/thegexgekko/gekko-media-overlay/releases/download/v0.4.1/gekko-media-overlay-0.4.1.zip'
          module_path.write_text(json.dumps(module, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8').replace('Version actuelle : **0.4.0**.', 'Version actuelle : **0.4.1**.')
          readme_path.write_text(readme, encoding='utf-8')

          css_path = Path('styles/media-overlay.css')
          css = css_path.read_text(encoding='utf-8').replace('/* GEKKO — Media Overlay v0.3.5 */', '/* GEKKO — Media Overlay v0.4.1 */', 1)
          css_path.write_text(css, encoding='utf-8')

          Path('.github/workflows/apply-v041.yml').unlink(missing_ok=True)
          PY

      - name: Validate JavaScript
        run: node --check scripts/media-overlay.js

      - name: Validate manifest
        run: node -e "const m=require('./module.json'); if(m.version!=='0.4.1') process.exit(1); if(!m.download.includes('/v0.4.1/')) process.exit(1);"

      - name: Commit v0.4.1
        shell: bash
        run: |
          git config user.name "thegexgekko"
          git config user.email "thegexgekko@gmail.com"
          git add -A
          git commit -m "Fix token-attached overlay visibility in v0.4.1"
          git push
